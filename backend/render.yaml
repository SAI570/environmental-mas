services:
  - type: web
    name: environmental-mas-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python scripts/train_model.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      # - key: DATABASE_URL
      #   value: postgresql://postgres:password@db.supabase.co:5432/postgres
